# Install as /etc/nginx/sites-available/simamia and symlink into sites-enabled.
# Certbot can add TLS directives after DNS for each host resolves to this server.
server {
    listen 80;
    listen [::]:80;
    server_name simamia.online;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.simamia.online;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.simamia.online;

    client_max_body_size 10M;
    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_set_header Host $host;
