map $uri $simamia_route {
  default "/static";
  ~^/api/v1/health$ "/api/v1/health";
  ~^/api/v1/(businesses|customers|services|orders|team|expenses|payments)$ "/api/v1/$1";
  ~^/api/v1/(businesses|customers|services|orders|team|expenses|payments)/[^/]+$ "/api/v1/$1/{id}";
  ~^/auth/callback/?$ "/auth/callback";
  ~^/$ "/";
}

log_format simamia_json escape=json '{"timestamp":"$time_iso8601","level":"info","service":"simamia-app","event":"http_request","request_id":"$request_id","method":"$request_method","route":"$simamia_route","status":$status,"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout simamia_json;
  error_log /dev/stderr warn;
  add_header X-Request-ID $request_id always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
