services:
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    restart: unless-stopped
    networks: [simamia]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CAMEL_ACCOUNTS_URL: ${NEXT_PUBLIC_CAMEL_ACCOUNTS_URL:-https://accounts.camelcreatives.com}
        NEXT_PUBLIC_CAMEL_ACCOUNTS_CLIENT_ID: ${NEXT_PUBLIC_CAMEL_ACCOUNTS_CLIENT_ID:-simamia-35sj96}
        NEXT_PUBLIC_SIMAMIA_API_URL: ${NEXT_PUBLIC_SIMAMIA_API_URL:-https://api.simamia.online/api/v1}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_DISABLED: ${NEXT_PUBLIC_SENTRY_DISABLED:-false}
    restart: unless-stopped
    depends_on: [api]
    networks: [simamia]

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      SIMAMIA_API_URL: http://api:8080/api/v1
      SIMAMIA_ADMIN_EMAIL: ${SIMAMIA_ADMIN_EMAIL:?Set the admin email}
      SIMAMIA_ADMIN_API_TOKEN: ${SIMAMIA_ADMIN_API_TOKEN:?Set a random 32+ character admin API token}
      SIMAMIA_ADMIN_PASSWORD: ${SIMAMIA_ADMIN_PASSWORD:?Set the private admin password}
      SIMAMIA_ADMIN_SESSION_SECRET: ${SIMAMIA_ADMIN_SESSION_SECRET:?Set a random 32+ character session secret}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN:-https://admin.simamia.online}
    depends_on: [api]
    networks: [simamia]

  docs:
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [simamia]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIMAMIA_DB_PATH: /data/simamia.db
      CAMEL_ACCOUNTS_URL: ${CAMEL_ACCOUNTS_URL:-https://accounts.camelcreatives.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.simamia.online}
      SIMAMIA_ADMIN_TOKEN: ${SIMAMIA_ADMIN_API_TOKEN:-}
      SIMAMIA_ADMIN_ACTOR: ${SIMAMIA_ADMIN_ACTOR:-platform-operator}
    volumes:
      - simamia_data:/data
    networks: [simamia]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [landing, app, admin, docs, api]
    networks: [simamia]

networks:
  simamia:

volumes:
  simamia_data:
  caddy_data:
  caddy_config:
