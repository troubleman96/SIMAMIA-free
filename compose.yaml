services:
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    restart: unless-stopped
    networks: [simamia]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CAMEL_ACCOUNTS_URL: ${NEXT_PUBLIC_CAMEL_ACCOUNTS_URL:-https://accounts.camelcreatives.com}
        NEXT_PUBLIC_CAMEL_ACCOUNTS_CLIENT_ID: ${NEXT_PUBLIC_CAMEL_ACCOUNTS_CLIENT_ID:-simamia-35sj96}
        NEXT_PUBLIC_SIMAMIA_API_URL: ${NEXT_PUBLIC_SIMAMIA_API_URL:-https://api.simamia.online/api/v1}
    restart: unless-stopped
    depends_on: [api]
    networks: [simamia]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      SIMAMIA_DB_PATH: /data/simamia.db
      CAMEL_ACCOUNTS_URL: ${CAMEL_ACCOUNTS_URL:-https://accounts.camelcreatives.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.simamia.online}
    volumes:
      - simamia_data:/data
    networks: [simamia]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [landing, app, api]
    networks: [simamia]

networks:
  simamia:

volumes:
  simamia_data:
  caddy_data:
  caddy_config:
