openapi: 3.1.0
info:
  title: HudumaDesk Service Management API
  version: 0.1.0
  description: >-
    Go MVP reference API for service operations in Tanzania. This preview API is
    unauthenticated, uses in-memory sample data and is not safe for production
    customer information. All responses use JSON envelopes; payments are derived
    from order records and are read-only.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Go API
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health and local defaults
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  status: ok
                  service: hudumadesk-api
                  version: v1
                  time_zone: Africa/Dar_es_Salaam
                  currency: TZS
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{resource}:
    parameters:
      - $ref: '#/components/parameters/Resource'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listRecords
      summary: List and filter a collection
      description: Supports orders, customers, services and team. Use `/payments` for the separate read-only payment ledger.
      parameters:
        - name: q
          in: query
          description: Case-insensitive search across a record's JSON fields.
          schema:
            type: string
        - name: status
          in: query
          description: Exact status filter; primarily used by orders.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Requested page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 100
      responses:
        '200':
          description: Filtered records and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      operationId: createRecord
      summary: Create an order, customer, service or team record
      description: Resource-specific required fields are validated. Payments cannot be created through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
            examples:
              customer:
                value:
                  name: Demo Customer Created
                  phone: '+255 700 000 010'
                  email: demo.created@example.test
                  location: Kinondoni, Dar es Salaam
              service:
                value:
                  name: Office cleaning
                  category: Cleaning
                  duration: 3 hours
                  price: 185000
              order:
                value:
                  customer: Demo Customer Created
                  service: Office cleaning
                  date: '2026-10-12T09:00:00+03:00'
                  amount: 185000
                  status: New
                  method: M-Pesa
                  assignee: Demo Staff 01
      responses:
        '201':
          description: Created record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{resource}/{id}:
    parameters:
      - $ref: '#/components/parameters/Resource'
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getRecord
      summary: Read one order, customer, service or team record
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    patch:
      operationId: updateRecord
      summary: Partially update a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
      responses:
        '200':
          description: Updated record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteRecord
      summary: Delete a record
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  id: ORD-0248
                  deleted: true
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /payments:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listPaymentLedger
      summary: Read balances derived from orders
      description: Read-only; each entry derives amount, paid and due from its order. This is not a payment processor or fiscal receipt.
      responses:
        '200':
          description: Derived ledger rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      description: Supported collection.
      schema:
        type: string
        enum: [orders, customers, services, team]
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied request identifier; one is generated when omitted.
      schema:
        type: string
  schemas:
    RecordInput:
      type: object
      additionalProperties: true
      description: Resource-specific JSON properties; server-generated `id` is ignored on updates.
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/ListMeta'
    Meta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [pagination]
          properties:
            pagination:
              type: object
              required: [page, page_size, total, total_pages]
              properties:
                page:
                  type: integer
                page_size:
                  type: integer
                total:
                  type: integer
                total_pages:
                  type: integer
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
  responses:
    InvalidJson:
      description: Invalid JSON request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Missing or invalid required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Endpoint or record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: Method is not supported for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
