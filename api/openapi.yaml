openapi: 3.1.0
info:
  title: Simamia Service Management API
  version: 0.1.0
  summary: REST API for Simamia service operations
  description: Contract documented from the Go implementation in api/main.go. Data endpoints require a Camel Accounts
    bearer access token. Records are scoped to the Camel Accounts subject. SQLite persistence is intended for a
    single API instance. Payments are a read-only view derived from orders, not provider transactions.
  contact:
    name: Simamia API documentation
    url: https://simamia.online
servers:
- url: https://api.simamia.online/api/v1
  description: Production
- url: http://localhost:8080/api/v1
  description: Local Go API
externalDocs:
  description: Full narrative guides, workflow diagrams, auth, and current limitations
  url: https://docs.simamia.online
security:
- camelBearer: []
tags:
- name: Health
  description: Unauthenticated process health.
- name: Businesses
  description: Profiles selected during Simamia onboarding. The Go API accepts any JSON object for this resource
    and does not enforce required fields or uniqueness.
- name: Customers
  description: Customer contact records. name and phone must be present and non-empty. Phone uniqueness and syntax
    are not validated.
- name: Services
  description: Catalog items. name must be present and non-empty; price must be greater than zero. currency and
    active default to TZS and true.
- name: Orders and jobs
  description: Work units used across business templates. customer, service, and amount are required; amount must
    be greater than zero. status, paid, and currency default to New, 0, and TZS. Other properties are retained as
    flexible JSON. Status transitions and paid-versus-amount invariants are not enforced.
- name: Team
  description: Directory records only. name and phone are required. These records do not create API identities or
    grant permissions.
- name: Expenses
  description: Expense entries. description, category, date are required and non-empty; amount must be greater than
    zero. Date is not parsed and categories are not constrained.
- name: Payments
  description: Read-only balances derived from account-owned orders.
- name: CORS and preflight
  description: Browser preflight requests handled before route authentication. Responses expose X-Request-ID to browser clients.
- name: Admin
  description: Private platform administration API. Requests use X-Simamia-Admin-Key and must originate from the admin Next.js server. Camel Accounts identities and credentials are managed separately.
paths:
  /admin/overview:
    get:
      tags: [Admin]
      operationId: getAdminOverview
      summary: Get platform record overview
      security:
      - simamiaAdminKey: []
      responses:
        '200':
          description: Tenant count, stored record total, and counts by resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/accounts:
    get:
      tags: [Admin]
      operationId: listAdminAccounts
      summary: List Simamia tenants inferred from stored records
      description: These are owner_sub values associated with Simamia business data, not a canonical Camel Accounts user directory. Supports q, page, and page_size.
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant summaries and resource counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListEnvelope'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
  /admin/accounts/{owner_sub}:
    get:
      tags: [Admin]
      operationId: getAdminAccount
      summary: Get one Simamia tenant summary
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      responses:
        '200':
          description: Tenant profile records and resource counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/accounts/{owner_sub}/{resource}:
    get:
      tags: [Admin]
      operationId: listAdminAccountRecords
      summary: List records for a tenant and resource
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      - $ref: '#/components/parameters/AdminResource'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant scoped records and pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListEnvelope'
    post:
      tags: [Admin]
      operationId: createAdminAccountRecord
      summary: Create a tenant record
      description: Assigns id and owner_sub on the server, applies the same validation as the business API, and writes an audit event.
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      - $ref: '#/components/parameters/AdminResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRecordInput'
      responses:
        '201':
          description: Created tenant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/accounts/{owner_sub}/{resource}/{record_id}:
    get:
      tags: [Admin]
      operationId: getAdminAccountRecord
      summary: Get a tenant record
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      - $ref: '#/components/parameters/AdminResource'
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Tenant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateAdminAccountRecord
      summary: Update a tenant record
      description: Merges supplied properties, preserves ownership and id, validates the result, and records changed field names in the audit log.
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      - $ref: '#/components/parameters/AdminResource'
      - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRecordInput'
      responses:
        '200':
          description: Updated tenant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      operationId: deleteAdminAccountRecord
      summary: Delete a tenant record
      description: Permanently removes one Simamia business record and adds an audit event. Payments are derived and cannot be edited directly.
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/OwnerSub'
      - $ref: '#/components/parameters/AdminResource'
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/usage:
    get:
      tags: [Admin]
      operationId: getAdminUsage
      summary: Get SQLite usage indicators
      description: Counts records and serialized payload bytes by resource, recent creations, latest updates, and audit event count. Payload bytes exclude indexes, WAL, and backups.
      security:
      - simamiaAdminKey: []
      responses:
        '200':
          description: Usage metrics by resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
  /admin/health:
    get:
      tags: [Admin]
      operationId: getAdminHealth
      summary: Check API and database health
      description: Verifies API database connectivity and reports configured identity/admin services. It does not probe Camel Accounts or replace container monitoring.
      security:
      - simamiaAdminKey: []
      responses:
        '200':
          description: Current process, SQLite, and configuration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
  /admin/audit:
    get:
      tags: [Admin]
      operationId: listAdminAudit
      summary: List administrator changes
      description: Newest first. Stores actor, action, resource, record and tenant IDs, timestamp, and changed field names. Business record values are excluded.
      security:
      - simamiaAdminKey: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Administrator audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListEnvelope'
  /businesses:
    get:
      tags:
      - Businesses
      operationId: listBusinesses
      summary: List businesses
      description: Profiles selected during Simamia onboarding. The Go API accepts any JSON object for this resource
        and does not enforce required fields or uniqueness. Results are restricted to the authenticated Camel Accounts
        subject. q/status filtering is performed before pagination. A page beyond the end returns an empty array.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Collection and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      tags:
      - Businesses
      operationId: createBusinessProfile
      summary: Create business profile
      description: Profiles selected during Simamia onboarding. The Go API accepts any JSON object for this resource
        and does not enforce required fields or uniqueness. The API assigns the record ID and owner_sub; caller-supplied
        ID/ownership values cannot establish ownership. Request properties are open ended and unknown properties
        are preserved.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Business'
            examples:
              example:
                summary: Businesses request
                value:
                  businessName: Amani Laundry
                  phone: '+255712345678'
                  primaryTemplate: laundry
                  templateVersion: 1
                  createdAt: '2026-10-11T11:00:00+03:00'
        description: Request bodies are limited to 1 MiB and must contain exactly one JSON object.
      responses:
        '201':
          description: Record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessEnvelope'
              example: &id001
                data:
                  id: BIZ-0001
                  owner_sub: camel-account-subject
                  businessName: Amani Laundry
                  phone: '+255712345678'
                  primaryTemplate: laundry
                  templateVersion: 1
                  ownerSub: camel-account-subject
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    options:
      tags:
      - CORS and preflight
      operationId: preflightBusinessesCollection
      summary: Handle browser CORS preflight
      description: The handler returns 204 before routing or authentication. Allowed methods are GET, POST, PATCH,
        DELETE, OPTIONS; allowed request headers are Content-Type, Authorization, X-Request-ID.
      security: []
      responses:
        '204':
          description: Preflight accepted. Access-Control-Allow-Origin depends on CORS_ALLOWED_ORIGINS.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
  /businesses/{id}:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/RequestId'
    get:
      tags:
      - Businesses
      operationId: getBusinessProfile
      summary: Get one business profile
      description: Returns the matching record only when it is owned by the authenticated subject. A record owned
        by another subject is indistinguishable from a missing record.
      responses:
        '200':
          description: Record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessEnvelope'
              example: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    patch:
      tags:
      - Businesses
      operationId: patchBusinessProfile
      summary: Partially update business profile
      description: Performs a shallow merge into the current JSON record and validates the merged result. The API
        ignores id, owner_sub, and ownerSub from this body. No business-specific field schema or workflow transition
        is enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBusiness'
            examples:
              partial:
                value:
                  templateVersion: 1
                  createdAt: '2026-10-11T11:00:00+03:00'
        description: Request bodies are limited to 1 MiB and must contain exactly one JSON object.
      responses:
        '200':
          description: Updated record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessEnvelope'
              example: *id001
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    delete:
      tags:
      - Businesses
      operationId: deleteBusinessProfile
      summary: Permanently delete business profile
      description: Permanently removes the row. There is no archive, soft-delete, cascade, or restore operation.
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEnvelope'
              example:
                data:
                  id: BIZ-0001
                  deleted: true
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    options:
      tags:
      - CORS and preflight
      operationId: preflightBusinessesItem
      summary: Handle browser CORS preflight
      description: The handler returns 204 before routing or authentication. Allowed methods are GET, POST, PATCH,
        DELETE, OPTIONS; allowed request headers are Content-Type, Authorization, X-Request-ID.
      security: []
      responses:
        '204':
          description: Preflight accepted. Access-Control-Allow-Origin depends on CORS_ALLOWED_ORIGINS.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
  /customers:
    get:
      tags:
      - Customers
      operationId: listCustomers
      summary: List customers
      description: Customer contact records. name and phone must be present and non-empty. Phone uniqueness and
