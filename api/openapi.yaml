        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    options:
      tags:
      - CORS and preflight
      operationId: preflightExpensesItem
      summary: Handle browser CORS preflight
      description: The handler returns 204 before routing or authentication. Allowed methods are GET, POST, PATCH,
        DELETE, OPTIONS; allowed request headers are Content-Type, Authorization, X-Request-ID.
      security: []
      responses:
        '204':
          description: Preflight accepted. Access-Control-Allow-Origin depends on CORS_ALLOWED_ORIGINS.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Check API process health
      description: Public liveness response. Does not test Camel Accounts, authenticated data access, or SQLite
        write readiness.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process handled the health request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                data:
                  status: ok
                  service: simamia-api
                  version: v1
                  time_zone: Africa/Dar_es_Salaam
                  currency: TZS
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    options:
      tags:
      - CORS and preflight
      operationId: preflightHealth
      summary: Handle health CORS preflight
      security: []
      responses:
        '204':
          description: Preflight accepted.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
  /payments:
    get:
      tags:
      - Payments
      operationId: listPaymentLedger
      summary: List derived payment balances
      description: 'Returns one ledger row per owned order. Each row is computed from order.amount and order.paid
        when requested: due = amount - paid; status is paid if paid >= amount, otherwise pending. This route does
        not call or verify a payment provider. It ignores list filters and returns all rows for the account.'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Derived ledger rows with the implementation pagination metadata (page=1, page_size=number
            of rows, total=number of rows, total_pages=1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLedgerListEnvelope'
              example:
                data:
                - id: PAY-0248
                  order_id: ORD-0248
                  customer: Asha Mushi
                  amount: 25000
                  paid: 10000
                  due: 15000
                  currency: TZS
                  method: M-Pesa
                  status: pending
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
                  pagination:
                    page: 1
                    page_size: 1
                    total: 1
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    options:
      tags:
      - CORS and preflight
      operationId: preflightPayments
      summary: Handle payment ledger CORS preflight
      description: Returns 204 before auth or route handling. Allowed methods are GET, POST, PATCH, DELETE, OPTIONS;
        allowed headers are Content-Type, Authorization, X-Request-ID.
      security: []
      responses:
        '204':
          description: Preflight accepted.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
components:
  securitySchemes:
    camelBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: Access token from a successful Camel Accounts OAuth session. Sent to Camel Accounts /oauth/userinfo
        for validation.
    simamiaAdminKey:
      type: apiKey
      in: header
      name: X-Simamia-Admin-Key
      description: Private server-to-server key. Never expose this key in browser code; call through the Admin app proxy.
  parameters:
    OwnerSub:
      name: owner_sub
      in: path
      required: true
      description: Camel Accounts subject owning these Simamia records.
      schema:
        type: string
    AdminResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [businesses, customers, services, orders, team, expenses]
    AdminRecordId:
      name: record_id
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional correlation ID echoed in the response header and meta. Generated by the API when omitted.
      schema:
        type: string
    RecordId:
      name: id
      in: path
      required: true
      description: Server-generated record ID.
      schema:
        type: string
    Q:
      name: q
      in: query
      description: Case-insensitive substring search across the JSON serialization of each owned record.
      schema:
        type: string
    Status:
      name: status
      in: query
      description: Exact, case-sensitive match against the record status property.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: One-based page number. Invalid or less-than-one values use 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Page size; invalid or less-than-one values use 20. Values above 100 are capped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    AdminRecordInput:
      type: object
      additionalProperties: true
      description: Flexible record payload; ID and tenant ownership are assigned/protected server-side.
    AdminEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    AdminListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      required:
      - request_id
      - timestamp
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
      - page
      - page_size
      - total
      - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    SuccessEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    DeleteResult:
      type: object
      required:
      - id
      - deleted
      properties:
        id:
          type: string
        deleted:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required:
      - error
      - meta
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    Business:
      type: object
      properties: &id008
        businessName: &id014
          type: string
          description: Business display name. Required by the app flow, but not required by API validation.
        phone: &id015
          type: string
          description: Business contact phone. The API does not normalize or validate phone syntax.
        primaryTemplate: &id016
          type: string
          description: Selected workflow template ID, for example general, salon, garage, phone_repair, laundry,
            butcher, mobile_money, or tailor.
        templateVersion: &id017
          type: integer
          description: Client supplied template version.
        createdAt: &id018
          type: string
          description: Client supplied creation timestamp; the API does not parse this field.
      additionalProperties: true
    Customer:
      type: object
      properties: &id009
        name: &id019
          type: string
          description: Customer name. Required and non-empty after whitespace trimming.
        phone: &id020
          type: string
          description: Customer phone. Required and non-empty; no normalization or syntax check.
        email: &id021
          type: string
          description: Optional customer email address; not syntax-validated.
        location: &id022
          type: string
          description: Optional address or area.
        orders: &id023
          type: integer
          description: Optional client maintained order count.
        spent: &id024
          type: number
          description: Optional client maintained lifetime spend amount.
        currency: &id025
          type: string
          description: Optional display currency, commonly TZS.
        last: &id026
          type: string
          description: Optional client maintained last-visit label.
      additionalProperties: true
      required:
      - name
      - phone
    Service:
      type: object
      properties: &id010
        name: &id027
          type: string
          description: Service name; required and non-empty.
        category: &id028
          type: string
          description: Optional caller-defined category.
        duration: &id029
          type: string
          description: Optional caller-defined duration label.
        price: &id030
          type: number
          description: Price amount; required and greater than zero.
          exclusiveMinimum: 0
        currency: &id031
          type: string
          description: Currency label; defaults to TZS when omitted.
        active: &id032
          type: boolean
          description: Whether the service is active; defaults to true.
      additionalProperties: true
      required:
      - name
      - price
    Order:
      type: object
      properties: &id011
        customer: &id033
          type: string
          description: Customer display name; required and non-empty. No customer ID relationship is enforced.
        phone: &id034
          type: string
          description: Optional customer phone copied onto the job.
        service: &id035
          type: string
          description: Service display name; required and non-empty. No catalog relationship is enforced.
        date: &id036
          type: string
          description: Optional scheduled/received date or timestamp; use ISO 8601 consistently.
        amount: &id037
          type: number
          description: Total job amount; required and greater than zero.
          exclusiveMinimum: 0
        paid: &id038
          type: number
          description: Amount paid so far; defaults to zero. It may exceed amount because this is not validated.
        currency: &id039
          type: string
          description: Currency label; defaults to TZS.
        status: &id040
          type: string
          description: Workflow status; defaults to New. Any string is accepted, with no transition validation.
        method: &id041
          type: string
          description: Payment method label, such as M-Pesa, Cash, Mixx by Yas, Airtel Money, or —.
        assignee: &id042
          type: string
          description: Optional staff display name.
        paymentType: &id043
          type: string
          description: Optional app field describing payment type, for example Installment.
        templateId: &id044
          type: string
          description: Optional app workflow template identifier.
        customFields: &id045
          type: object
          additionalProperties:
            type: string
          description: Optional template-specific fields; arbitrary string-keyed values are retained.
      additionalProperties: true
      required:
      - customer
      - service
      - amount
    TeamMember:
      type: object
      properties: &id012
        name: &id046
          type: string
          description: Team member name; required and non-empty.
        phone: &id047
          type: string
          description: Team member phone; required and non-empty.
        role: &id048
          type: string
          description: Optional role label; not used for authorization.
        active: &id049
          type: boolean
          description: Optional display flag; not enforced by access checks.
        commissionRate: &id050
          type: number
          description: Optional arbitrary client field; no commission calculation is performed.
      additionalProperties: true
      required:
      - name
      - phone
    Expense:
      type: object
      properties: &id013
        description: &id051
          type: string
          description: Expense description; required and non-empty.
        category: &id052
          type: string
          description: Expense category; required and non-empty, but caller-defined.
        amount: &id053
          type: number
          description: Expense amount; required and greater than zero.
          exclusiveMinimum: 0
        date: &id054
          type: string
          description: Expense date; required and non-empty. Use YYYY-MM-DD; API does not parse it.
        method: &id055
          type: string
          description: Optional payment-method label.
        vendor: &id056
          type: string
          description: Optional supplier/vendor name.
        notes: &id057
          type: string
          description: Optional note.
      additionalProperties: true
      required:
      - description
      - category
      - amount
      - date
    PaymentLedgerEntry:
      type: object
      required:
      - id
      - order_id
      - customer
      - amount
      - paid
      - due
      - currency
      - method
      - status
      properties:
        id:
          type: string
          examples:
          - PAY-0248
        order_id:
          type: string
        customer:
          type: string
        amount:
          type: number
        paid:
          type: number
        due:
          type: number
          description: amount minus paid; can be negative if paid exceeds amount.
        currency:
          type: string
          const: TZS
        method:
          type:
          - string
          - 'null'
          description: Copies the order method value and may be null when the order has no method property.
        status:
          type: string
          enum:
          - paid
          - pending
          description: paid when paid >= amount; pending otherwise.
    PatchBusiness:
      type: object
      description: Only changed properties are required. The merged record is validated after the patch is applied.
      properties: *id008
      additionalProperties: true
    PatchCustomer:
      type: object
      description: Only changed properties are required. The merged record is validated after the patch is applied.
      properties: *id009
      additionalProperties: true
    PatchService:
      type: object
