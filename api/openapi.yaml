      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
            examples:
              example:
                summary: Services request
                value:
                  name: Wash and fold
                  category: Laundry
                  duration: 24 hours
                  price: 25000
        description: Request bodies are limited to 1 MiB and must contain exactly one JSON object.
      responses:
        '201':
          description: Record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvelope'
              example: &id003
                data:
                  id: SRV-0001
                  owner_sub: camel-account-subject
                  name: Wash and fold
                  category: Laundry
                  duration: 24 hours
                  price: 25000
                  currency: TZS
                  active: true
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '400':
