        is performed before pagination. A page beyond the end returns an empty array.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Collection and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      tags:
      - Customers
      operationId: createCustomer
      summary: Create customer
      description: Customer contact records. name and phone must be present and non-empty. Phone uniqueness and
        syntax are not validated. The API assigns the record ID and owner_sub; caller-supplied ID/ownership values
        cannot establish ownership. Request properties are open ended and unknown properties are preserved.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
            examples:
              example:
                summary: Customers request
                value:
                  name: Asha Mushi
                  phone: +255 712 345 678
                  email: asha@example.test
                  location: Kinondoni, Dar es Salaam
        description: Request bodies are limited to 1 MiB and must contain exactly one JSON object.
      responses:
        '201':
          description: Record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
              example: &id002
                data:
                  id: CUS-0001
                  owner_sub: camel-account-subject
                  name: Asha Mushi
                  phone: +255 712 345 678
                  email: asha@example.test
                  location: Kinondoni
                meta:
                  request_id: req_example
                  timestamp: '2026-10-11T08:00:00Z'
        '400':
