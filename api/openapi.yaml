    AdminDisabled:
      description: Admin API is disabled because SIMAMIA_ADMIN_TOKEN is not configured with at least 32 characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidJson:
      description: Malformed JSON, body not a JSON object, trailing JSON value, or invalid request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INVALID_JSON
              message: request body must contain one JSON object
            meta:
              request_id: req_example
              timestamp: '2026-10-11T08:00:00Z'
    Unauthorized:
      description: Missing, invalid, or expired Camel Accounts bearer token.
      content:
