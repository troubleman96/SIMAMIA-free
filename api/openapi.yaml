  /services:
    get:
      tags:
      - Services
      operationId: listServices
      summary: List services
      description: Catalog items. name must be present and non-empty; price must be greater than zero. currency
        and active default to TZS and true. Results are restricted to the authenticated Camel Accounts subject.
        q/status filtering is performed before pagination. A page beyond the end returns an empty array.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Collection and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
