      operationId: createService
      summary: Create service
      description: Catalog items. name must be present and non-empty; price must be greater than zero. currency
        and active default to TZS and true. The API assigns the record ID and owner_sub; caller-supplied ID/ownership
        values cannot establish ownership. Request properties are open ended and unknown properties are preserved.
