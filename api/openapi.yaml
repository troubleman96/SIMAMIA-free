      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: Method not allowed. Response includes an Allow header.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Required field missing/empty, or amount/price is not greater than zero.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StorageError:
      description: SQLite storage operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthUnavailable:
      description: Camel Accounts userinfo could not be reached within the 4 second timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
