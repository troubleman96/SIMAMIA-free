log_format simamia_json escape=json '{"timestamp":"$time_iso8601","level":"info","service":"simamia-landing","event":"http_request","request_id":"$request_id","method":"$request_method","route":"$uri","status":$status,"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  access_log /dev/stdout simamia_json;
  error_log /dev/stderr warn;
  add_header X-Request-ID $request_id always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
